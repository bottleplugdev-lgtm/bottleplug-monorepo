name: Deploy to Digital Ocean

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_bottleplug
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          web/package-lock.json
          dashboard/package-lock.json

    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Install Frontend dependencies
      run: |
        cd web && npm ci
        cd ../dashboard && npm ci

    - name: Create Firebase credentials for testing
      run: |
        cd backend
        mkdir -p firebase
        cat > firebase/test-credentials.json << 'EOF'
        {
          "type": "service_account",
          "project_id": "test-project",
          "private_key_id": "test-key-id",
          "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDk5eqGUUp8V2aH\nBQTsFN5QR3JdhdChVBSBxQZ1+4caKYOnewECnPiidygGh0qwSOGsJLhQahKeLzmX\nCTlLR/O5mMNOxq3dgJyVz22cL3xGo4JeiqHOjnfjg2ii3Viehv/D5reatdlAXQ1E\nHX9Ykb8fhD8DHw/pjnVbHRmPCOqCHE0M4aEJHeaRohFWPtTsz6wqRD/RltUdAKbY\nGSAIMORNJ9dC+JRBsKDANJIhXp8Ye2I3pDHKY4Zn4E8hLsfafCg7cW9KPdhp2DyK\nbKBCBufg+Mv5orK39V3fKbDrzzHEVO+vRNoiO9QmKDRtaVi0oUZQCAdgoYUaC2rp\n+15w9cSNAgMBAAECggEADwxjiFbrUfSQB8PnddrjCRLtZ03JxcrIj1sukyPzwZ9Q\nPxBEjyar553JqpuLPZQztp9yY6JZnNSHfCZt1xproPx0qKbssswxXzL+0TQY/u7h\n07PYXUNQs/XayPb1jB8yzO8L4UFf1KNZdiyHR6wgonfitE0+51CyO/N+5OsF5IL2\neeBkzpiYD8wLt8L0/Pw9TLBX0L2vQD8mh+z1oSGZ7xI1B+x4tO9Re+hN6DNKBeOM\n0UG/6t4BQ/EDX4PwLAL//LGz8ZVSjqq85NlKqVkCAMCjnJb36T5on/VpeN1zEv5I\nJ/KzqFLgyTtvA3Pqh6PQJ9G/8UflOetvVkqaJJAzKQKBgQDyaa7sVoE5EYtbqpCz\ngtfqIiCohsFzlyFTrkabYV6ENIiki8a/Qvlg6xHW6AvesBoQ3poItVnQPc0OSvSa\nPOzGqRMWfSs1qgpRCBvU2K52dS8WSdernzHyVLPEWIsQNkf8JTwawomlyhZYLj7/\nK7Zccb4kIXWJrY1FCa0hlCZ+iQKBgQDxulBULTLaWKeYaiN7jot4PbRIw4XZCHDH\neydlYOFLfkURRDB4+DzqgdyJfgG4IiLHn1hP7vi4dcPQl8Mi7bAFQxD0NQfQSZkT\nUVh2r32+3BJBUjezNo0w013/km8bhcfNPJfvPLAUhFS/nCGfHOh9WLTmkTr5cwTb\n7x0hD4z05QKBgDPo8a5mb9Gasi70/XuTX00h9cBg6vgnutlCjpgjZ6wD2+bwj6TR\nYLmiXPWaR0BukYZfRLjsrMjtEwYmgu6scT+xYQcF0sTxHrhvdhZEOEfhnC23rllw\nA7AS91Pqag0UsqGKD67jTbqU5egILzFRWQG+0arHB3ZuFbxc8Bgqs3uRAoGBANGn\nP46SmR2JcOqfe+DpFAwYsGm/szI2wOIy7UtfSGgavzqngscYvnTCZw2VDVavvKyY\nhpbldDFAarJbPjLoJheaQHUeHYXIn4yCrBBcStqjsu2Wqpq0AKdNW6STU+xyDoXy\nPPCRGULiN0Ls3rhK8VXt/xBO+/BoktlSPVh0TVQFAoGAfEVP7WlfDQcizI/JhmsQ\n/VEYFIMaEvPMqIpzmzRKuRIyaq/d5hyorn74b2a0XDJFeadd3GxD9qM2+YBS5RAl\nxSc28i0dbZehRHysTrgBDkUHSqBgX0pXhLWTBMCSBJBquUwp5QQRdPvaoDi9iUZw\nsiyHG488h3cwmIY3NvFwGH0=\n-----END PRIVATE KEY-----\n",
          "client_email": "test@test-project.iam.gserviceaccount.com",
          "client_id": "123456789012345678901",
          "auth_uri": "https://accounts.google.com/o/oauth2/auth",
          "token_uri": "https://oauth2.googleapis.com/token",
          "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
          "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/test%40test-project.iam.gserviceaccount.com",
          "universe_domain": "googleapis.com"
        }
        EOF

    - name: Set up test environment
      run: |
        cd backend
        cp env.example .env
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_bottleplug" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
        echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> .env
        echo "FIREBASE_CREDENTIALS_PATH=firebase/test-credentials.json" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env

    - name: Run database migrations
      run: |
        cd backend
        python manage.py migrate --verbosity=1

    - name: Run Python tests
      run: |
        cd backend
        python manage.py test --verbosity=1 --keepdb --failfast --settings=tanna_backend.test_settings
    
    - name: Run Frontend tests
      run: |
        echo "Frontend tests not configured, skipping..."
        # cd web && npm test --if-present
        # cd ../dashboard && npm test --if-present
    
    - name: Build Frontend applications
      run: |
        cd web && npm run build
        cd ../dashboard && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Deploy to Digital Ocean
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          set -e
          
          echo "🚀 Starting deployment to Digital Ocean..."
          
          # Navigate to application directory
          cd /opt/bottleplug
          
          # Create deployment log
          echo "$(date): Starting deployment" >> /opt/bottleplug/logs/deployment.log
          
          # Pull latest changes
          echo "📥 Pulling latest changes from git..."
          git fetch origin
          git reset --hard origin/main
          
          # Create backup of current deployment
          echo "💾 Creating backup..."
          if [ -d "backup" ]; then
            rm -rf backup/old_*
            mv backup backup/old_$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
          fi
          mkdir -p backup
          
          # Backup database
          echo "🗄️ Backing up database..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod exec -T db pg_dump -U bottleplug bottleplug > backup/db_backup_$(date +%Y%m%d_%H%M%S).sql || echo "Database backup failed, continuing..."
          
          # Stop current containers gracefully
          echo "🛑 Stopping current containers..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod down --timeout 30
          
          # Build and start new containers
          echo "🔨 Building and starting containers..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod build --no-cache --parallel
          docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d
          
          # Wait for services to be healthy
          echo "⏳ Waiting for services to start..."
          sleep 45
          
          # Create database if it doesn't exist
          echo "🗄️ Creating database if it doesn't exist..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod exec -T db psql -U bottleplug -d postgres -c "CREATE DATABASE bottleplug;" 2>/dev/null || echo "Database already exists or creation failed, continuing..."
          
          # Check if backend is healthy
          echo "🔍 Checking backend health..."
          for i in {1..10}; do
            if docker-compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend curl -f http://localhost:8000/api/health/ > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "⏳ Waiting for backend to be ready... (attempt $i/10)"
            sleep 10
          done
          
          # Run database migrations
          echo "🗄️ Running database migrations..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend python manage.py migrate
          
          # Collect static files
          echo "📁 Collecting static files..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend python manage.py collectstatic --noinput
          
          # Restart services to ensure everything is working
          echo "🔄 Restarting services..."
          docker-compose -f docker-compose.prod.yml --env-file .env.prod restart
          
          # Clean up old images and containers
          echo "🧹 Cleaning up old images..."
          docker image prune -f
          docker container prune -f
          
          # Check if everything is running
          echo "✅ Checking deployment status..."
          if docker-compose -f docker-compose.prod.yml --env-file .env.prod ps | grep -q "Up"; then
            echo "🎉 Deployment completed successfully!"
            echo "$(date): Deployment successful" >> /opt/bottleplug/logs/deployment.log
            
            # Test endpoints
            echo "🧪 Testing endpoints..."
            if curl -f http://localhost/api/health/ > /dev/null 2>&1; then
              echo "✅ Health check passed"
            else
              echo "⚠️ Health check failed"
            fi
          else
            echo "❌ Some containers are not running. Check logs:"
            docker-compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=50
            echo "$(date): Deployment failed" >> /opt/bottleplug/logs/deployment.log
            exit 1
          fi
          
          echo "📊 Deployment Summary:"
          echo "- Containers: $(docker-compose -f docker-compose.prod.yml --env-file .env.prod ps --services | wc -l) services"
          echo "- Status: $(docker-compose -f docker-compose.prod.yml --env-file .env.prod ps --format 'table {{.Name}}\t{{.Status}}')"
          echo "- Logs: docker-compose -f docker-compose.prod.yml --env-file .env.prod logs -f"

  notify:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      if: always() && env.SLACK_WEBHOOK != ''
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the GitHub Actions logs for details."